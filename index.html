<style>
/* Layout: sticky header (brand, clinic switcher, save status) over a tab strip; content column up to 1180px; patients tab is list + detail split, calendar is month grid + day list. */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --surface-2:#f6f8f6; --ink:#1c2926; --muted:#5d6f69; --line:#dce3df;
  --jade:#2d6a5c; --jade-strong:#22554a; --jade-soft:#e0eee8; --on-jade:#ffffff;
  --seal:#b3392d; --seal-soft:#f8e4e1;
  --amber:#8a5a0c; --amber-soft:#fbf0d6;
  --ok:#1f7a4d; --ok-soft:#dff3e7;
  --overlay:rgba(20,32,28,.5);
  --f-display:'Frank Ruhl Libre','David Libre',Georgia,serif;
  --f-body:'Heebo','Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121917; --surface:#1b2420; --surface-2:#222d29; --ink:#e5ece8; --muted:#92a39c; --line:#2c3833;
    --jade:#7cc2ad; --jade-strong:#9ad5c3; --jade-soft:#1e3730; --on-jade:#0e1a16;
    --seal:#ec8173; --seal-soft:#3b2220;
    --amber:#e5b863; --amber-soft:#3a2f16;
    --ok:#6fd09a; --ok-soft:#1b3326;
    --overlay:rgba(0,0,0,.62);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121917; --surface:#1b2420; --surface-2:#222d29; --ink:#e5ece8; --muted:#92a39c; --line:#2c3833;
  --jade:#7cc2ad; --jade-strong:#9ad5c3; --jade-soft:#1e3730; --on-jade:#0e1a16;
  --seal:#ec8173; --seal-soft:#3b2220;
  --amber:#e5b863; --amber-soft:#3a2f16;
  --ok:#6fd09a; --ok-soft:#1b3326;
  --overlay:rgba(0,0,0,.62);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.5; direction:rtl; text-align:right;
  padding-block:0; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-family:var(--f-display);font-weight:700;text-wrap:balance}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)} .sm{font-size:13px} .strong{font-weight:600}
.grow{flex:1;min-width:0}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:14px 0 10px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:54px;height:54px;flex:none}
.seal{width:40px;height:40px;border-radius:6px;background:var(--seal);color:#fff;display:grid;place-items:center;font-family:'Frank Ruhl Libre','Noto Serif CJK SC','Songti SC','SimSun',serif;font-size:24px;line-height:1;transform:rotate(-4deg)}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:23px;line-height:1.1;letter-spacing:.01em;direction:ltr;text-align:right}
.brand-sub{font-size:12px;color:var(--muted)}
.clinic-pick{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-inline-start:auto}
.clinic-pick select{min-width:0;max-width:260px}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;min-width:84px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.status.busy i{background:var(--amber)} .status.err i{background:var(--seal)} .status.err{color:var(--seal)}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:20px;scrollbar-width:thin}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 16px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--jade-strong);border-bottom-color:var(--jade)}

/* controls */
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;font-size:14px;line-height:1.3}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--jade);border-color:var(--jade);color:var(--on-jade)}
.btn.primary:hover{background:var(--jade-strong);border-color:var(--jade-strong)}
.btn.danger{color:var(--seal);border-color:var(--seal)}
.btn.danger.solid{background:var(--seal);color:#fff;border-color:var(--seal)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.link{border:0;background:none;padding:4px 6px;color:var(--jade-strong)}
.btn.link.danger{color:var(--seal)}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;color:var(--ink);text-align:right}
input[type="checkbox"]{width:auto;accent-color:var(--jade)}
input[type="range"]{padding:0;accent-color:var(--jade)}
input[type="date"],input[type="time"],input[type="tel"],input[type="email"]{direction:rtl}
textarea{resize:vertical;min-height:70px}
label{font-size:13px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px}
.fld{display:block}
.frow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form{display:flex;flex-direction:column;gap:12px}
.form-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-start;padding-top:12px;border-top:1px solid var(--line);margin-top:4px}
.form-actions .push{margin-inline-start:auto}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.card-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-head h3{font-size:19px}
.stack{display:flex;flex-direction:column;gap:16px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.metric .k{font-size:13px;color:var(--muted)}
.metric .v{font-family:var(--f-display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:4px}
.metric .n{font-size:12px;color:var(--muted)}
.hero{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.hero h2{font-size:28px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;border:1px solid transparent;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--amber-soft);color:var(--amber)}
.pill.jade{background:var(--jade-soft);color:var(--jade-strong)}
.pill.bad{background:var(--seal-soft);color:var(--seal)}
button.pill{cursor:pointer;font-family:inherit}
.empty{padding:26px 10px;text-align:center;color:var(--muted);font-size:14px}

/* rows */
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.row + .row{margin-top:8px}
.time{font-variant-numeric:tabular-nums;font-weight:700;background:var(--jade-strong);color:var(--on-jade);border-radius:8px;padding:5px 10px;font-size:14px;text-align:center;min-width:64px}
.time .d{display:block;font-size:10px;font-weight:500;opacity:.85}
.is-cancel{opacity:.6}
.is-cancel .strong{text-decoration:line-through}
.acts{display:flex;gap:2px;flex-wrap:wrap;align-items:center}

/* patients */
.split{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:18px;align-items:start}
.plist{display:flex;flex-direction:column;gap:8px;max-height:620px;overflow-y:auto}
.pitem{text-align:right;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer;display:block}
.pitem:hover{background:var(--surface-2)}
.pitem[aria-current="true"]{border-color:var(--jade);box-shadow:0 0 0 1px var(--jade);background:var(--jade-soft)}
.pitem .top2{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.pitem .cl{font-size:12px;color:var(--muted);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.notes{background:var(--amber-soft);border:1px solid var(--amber);border-radius:10px;padding:12px 14px}
.notes label{color:var(--amber)}
.notes textarea{background:var(--surface);min-height:64px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 18px;font-size:14px}
.kv dt{font-size:12px;color:var(--muted);font-weight:600}
.kv dd{margin:0}
.treat{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface-2)}
.treat + .treat{margin-top:10px}
.treat-head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:10px}
.pain{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.pain b{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:50%;background:var(--seal-soft);color:var(--seal);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--jade-soft);color:var(--jade-strong);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px;font-size:14px}
.two h5,.blk h5{margin:0 0 2px;font-size:12px;color:var(--muted);font-weight:600}
.blk{margin-top:10px;font-size:14px}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;min-width:120px}
.bar > span{display:block;height:100%;background:var(--jade);border-radius:999px}
.pk{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.pk + .pk{margin-top:8px}
.pk .use{min-width:170px}
.stepper{display:inline-flex;align-items:center;gap:4px}
.stepper .btn{padding:2px 9px}

/* calendar */
.cal-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,360px);gap:18px;align-items:start}
.cal-nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-nav h3{font-size:20px;min-width:140px;text-align:center}
.dow,.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow{font-size:12px;font-weight:600;color:var(--muted);text-align:center;margin-bottom:6px}
.day{min-height:78px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:6px;display:flex;flex-direction:column;justify-content:space-between;gap:4px;text-align:right;cursor:pointer;min-width:0}
.day:hover{border-color:var(--muted)}
.day.blank{background:transparent;border-color:transparent;cursor:default}
.day.today .num{background:var(--seal);color:#fff}
.day.sel{border-color:var(--jade);box-shadow:0 0 0 2px var(--jade);background:var(--jade-soft)}
.num{font-size:12px;font-weight:700;min-width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.day .cnt{font-size:11px;font-weight:700;color:var(--jade-strong)}
.day .names{display:flex;flex-direction:column;gap:2px;overflow:hidden}
.day .names span{font-size:10px;background:var(--jade-strong);color:var(--on-jade);border-radius:4px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.chk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--ink);margin:0;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);cursor:pointer}
/* modal */
#modal:empty{display:none}
.backdrop{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto;z-index:50}
.dialog{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:100%;max-width:520px;margin:auto;padding:20px;direction:rtl}
.dialog.wide{max-width:680px}
.dialog-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.dialog-head h3{font-size:21px}
.note{border-radius:8px;padding:8px 10px;font-size:13px}
.note.warn{background:var(--amber-soft);color:var(--amber)}
.note.info{background:var(--jade-soft);color:var(--jade-strong)}
.range-line{display:flex;align-items:center;gap:12px}
.range-line output{font-weight:700;min-width:28px;text-align:center;font-variant-numeric:tabular-nums}
#toast{position:fixed;bottom:max(18px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:10px;padding:9px 16px;font-size:14px;z-index:80;max-width:90vw}
#toast:empty{display:none}
.center{max-width:560px;margin:8vh auto 0}
.center h1{font-size:32px;margin-bottom:8px}
.status[data-act]{cursor:pointer}
.sigpad{display:block;width:100%;aspect-ratio:5/2;border:1px dashed var(--line);border-radius:8px;background:#fff;touch-action:none;cursor:crosshair}
a.btn{text-decoration:none;display:inline-flex;align-items:center}

@media (max-width:860px){
  .split,.cal-split{grid-template-columns:minmax(0,1fr)}
  .plist{max-height:300px}
}
@media (max-width:600px){
  .frow,.two{grid-template-columns:minmax(0,1fr)}
  .day{min-height:54px;padding:4px}
  .day .names{display:none}
  .hero h2{font-size:23px}
  .clinic-pick{margin-inline-start:0;width:100%}
  .clinic-pick select{flex:1}
}
@media (prefers-reduced-motion:no-preference){
  .btn,.pitem,.day,.tab{transition:background .15s,border-color .15s,color .15s}
}

/* --- local persistence --- */
function persist(){ dirty = true; setStatus(); if(!saveT && !saving) saveT = setTimeout(flushLocal, 0); }
function persistOut(){ kvSet('outbox', OUT).catch(function(){}); setStatus(); }
function flushLocal(){
  clearTimeout(saveT); saveT = null;
  if(!dirty) return Promise.resolve();
  if(saving) return savingP;
  dirty = false; saving = true;
  var data = { version:2, savedAt:new Date().toISOString(), clinics:S.clinics, patients:S.patients, appointments:S.appointments };
  savingP = kvSet('state', data).then(function(){
    saveErr = ''; storageOk = true;
    if(bc) try { bc.postMessage({ t:'state', from:TAB }); } catch(e){}
    fileBackupSoon();
  }).catch(function(e){
    dirty = true; storageOk = false;
    saveErr = 'השינוי האחרון לא נשמר במכשיר. ייתכן שאין מקום פנוי או שהדפדפן חוסם אחסון. הורד גיבוי עכשיו.';
    toast(saveErr);
  }).then(function(){ saving = false; setStatus(); if(dirty) return flushLocal(); });

}
function stamp(obj, prev){ var t = Date.now(), p = Math.max((prev && prev.u) || 0, obj.u || 0); obj.u = t > p ? t : p + 1; }
function queue(col, id, op, prev){

    var cl = col === 'clinics' ? id : ((prev && prev.clinicId) || '');
    if(!cl) { delete OUT[key]; persistOut(); return; }
    OUT[key] = { c:col, i:id, o:'del', cl:cl, u:Date.now() };
  } else OUT[key] = { c:col, i:id, o:'put' };
  persistOut(); scheduleSync(1500);
}
function write(col, obj){ stamp(obj, S[col][obj.id]); S[col][obj.id] = obj; persist(); queue(col, obj.id); return Promise.resolve(); }
function remove(col, id){ var prev = S[col][id]; delete S[col][id]; persist(); queue(col, id, 'del', prev); return Promise.resolve(); }
function queueAll(){
  ['clinics','patients','appointments'].forEach(function(col){ Object.keys(S[col]).forEach(function(id){ S[col][id].id = id; stamp(S[col][id]); OUT[col+':'+id] = { c:col, i:id, o:'put' }; }); });

}
function wipeLocal(){
  S.clinics = {}; S.patients = {}; S.appointments = {}; OUT = {}; CURSOR = ''; lastFull = 0;
  dirty = true; return flushLocal().then(function(){ return Promise.all([kvDel('outbox'), kvDel('cursor')]); });
}
function renderSoft(){

}
function reloadFromKv(){

    if(r[0]){ S.clinics = r[0].clinics || {}; S.patients = r[0].patients || {}; S.appointments = r[0].appointments || {}; }
    OUT = r[1] || {}; CURSOR = r[2] || CURSOR; renderSoft();
  });
}

/* --- automatic backup to a chosen file (Chrome / Edge on desktop) --- */
var fsaOk = function(){ return !!(window.showSaveFilePicker && idb); };
function fileBackupSoon(){ if(!FH) return; clearTimeout(fileT); fileT = setTimeout(function(){ writeBackupFile(); }, 15000); }
function writeBackupFile(){
  if(!FH) return Promise.resolve(false);
  return Promise.resolve(FH.queryPermission ? FH.queryPermission({ mode:'readwrite' }) : 'granted').then(function(p){
    if(p !== 'granted'){ FILE.needPerm = true; return false; }
    return FH.createWritable().then(function(w){ return w.write(JSON.stringify(snapshot(), null, 2)).then(function(){ return w.close(); }); })
      .then(function(){ FILE.last = Date.now(); FILE.needPerm = false; FILE.err = ''; try { localStorage.setItem(BKEY, new Date().toISOString()); } catch(e){} return true; });
  }).catch(function(e){ FILE.err = errMsg(e); return false; });
}
function pickBackupFile(){

    FH = h; return kvSet('fh', h);
  }).then(function(){ return writeBackupFile(); }).then(function(){ toast('גיבוי אוטומטי לקובץ הופעל'); backupCenter(); }).catch(function(e){ if(e && e.name !== 'AbortError') toast('לא ניתן לחבר קובץ: '+errMsg(e)); });
}
function askFilePerm(){

}
function dropBackupFile(){ FH = null; FILE.needPerm = false; kvDel('fh'); backupCenter(); }

/* --- boot --- */
function loadLocal(){
  return kvGet('state').then(function(st){
    if(st) return st;

  });
}
function boot(){
  return idbOpen().then(function(d){

    OUT = r[1] || {}; CURSOR = r[2] || ''; MECACHE = r[3] || null; FH = r[4] || null;
    loaded.clinics = loaded.patients = loaded.appointments = true;
    if(st && st.migrated){
      snapPut('x:'+Date.now(), { clinics:S.clinics, patients:S.patients, appointments:S.appointments }).then(function(){
        dirty = true; return flushLocal();
      }).then(function(){ if(!saveErr && idb){ try { localStorage.removeItem(KEY); } catch(e){} } });
    }

/* ---------- cloud sync (Supabase) ---------- */
function loadLib(){
  return new Promise(function(res, rej){
    if(window.supabase && window.supabase.createClient) return res();
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js';
    s.onload = function(){ res(); }; s.onerror = function(){ rej(new Error('לא ניתן לטעון את ספריית הענן. בדוק חיבור לאינטרנט.')); };
    document.head.appendChild(s);
  });
}
function rpcFetch(u, k, fn, body){
  return fetch(String(u).replace(/\/+$/, '')+'/rest/v1/rpc/'+fn, { method:'POST', headers:{ 'Content-Type':'application/json', apikey:k }, body:JSON.stringify(body || {}) })
    .then(function(r){ if(!r.ok){ var e = new Error('HTTP '+r.status); e.status = r.status; throw e; } return r.json(); });
}
function fromProfile(x){ return { id:x.id, name:x.name, phone:x.phone||'', email:x.email||'', authEmail:x.auth_email, role:x.role, clinicIds:x.clinic_ids||[], active:x.active!==false, mustChange:!!x.must_change, createdAt:Date.parse(x.created_at)||0 }; }
function loadProfile(id){

}
function refreshMe(){

    var changed = JSON.stringify([m.role, m.clinicIds, m.name]) !== JSON.stringify([ME.role, ME.clinicIds, ME.name]);

}
function startCloud(){

    return sb.auth.getSession();

    var sess = r && r.data && r.data.session;

  }).catch(function(e){
    if(e && e.denied){ UI.auth = 'login'; UI.authMsg = 'החשבון מושבת או שאינו קיים. פנה למנהל המערכת.'; if(sb) sb.auth.signOut(); render(); return; }

function noSession(){

}
function enterApp(offline){
  return kvGet('owner').then(function(owner){
    var p = Promise.resolve();

      if(!owner && hasData() && UI.firstAdmin){ queueAll(); }
      else if(hasData() || Object.keys(OUT).length){
        p = snapPut('x:'+Date.now(), { clinics:S.clinics, patients:S.patients, appointments:S.appointments }).catch(function(){}).then(wipeLocal);
      }

}
function startSyncLoop(){

  setInterval(function(){ if(!document.hidden) syncNow(); }, 60000);

}
function startRealtime(){
  try {
    if(rt) sb.removeChannel(rt);

    ['clinics','patients','appointments','declarations'].forEach(function(t){ rt.on('postgres_changes', { event:'*', schema:'public', table:t }, function(){ scheduleSync(700); }); });
    rt.subscribe();
  } catch(e){}
}
function scheduleSync(ms){ clearTimeout(syncT); syncT = setTimeout(function(){ syncNow(); }, ms || 0); }

  syncBusy = true; SYNC.state = 'busy'; setStatus();

  return refreshMe().then(pushAll).then(function(){ return pullAll(doFull); }).then(function(){
    SYNC.state = 'ok'; SYNC.err = ''; SYNC.last = Date.now(); SYNC.ever = true; backoff = 0;
  }).catch(function(e){

var isRls = function(e){ return !!e && (e.code === '42501' || /row-level security|permission denied/i.test(e.message || '')); };
function toRow(col, o){ return col === 'clinics' ? { id:o.id, data:o, deleted:false } : { id:o.id, clinic_id:o.clinicId, data:o, deleted:false }; }
function delRow(col, it){
  var d = { u:it.u, id:it.i };
  return col === 'clinics' ? { id:it.i, data:d, deleted:true } : { id:it.i, clinic_id:it.cl, data:d, deleted:true };
}
function upsertRows(col, rows){
  var chunks = []; for(var i = 0; i < rows.length; i += 100) chunks.push(rows.slice(i, i + 100));
  return chunks.reduce(function(p, ch){
    return p.then(function(){
      return Promise.resolve(sb.from(col).upsert(ch, { onConflict:'id' })).then(function(r){
        if(!r.error) return;
        if(!isRls(r.error)) throw r.error;
        return ch.reduce(function(pp, row){
          return pp.then(function(){
            return Promise.resolve(sb.from(col).upsert(row, { onConflict:'id' })).then(function(rr){
              if(rr.error){ if(!isRls(rr.error)) throw rr.error; forceIds[col+':'+row.id] = 1; REJ++; }
            });
          });
        }, Promise.resolve());
      });
    });
  }, Promise.resolve());
}
function pushAll(){
  var keys = Object.keys(OUT); if(!keys.length) return Promise.resolve();
  var before = REJ;
  return ['clinics','patients','appointments'].reduce(function(p, col){
    return p.then(function(){
      var items = keys.map(function(k){ return OUT[k]; }).filter(function(it){ return it && it.c === col; });
      var rows = [];
      items.forEach(function(it){
        if(it.o === 'del') rows.push(delRow(col, it));
        else { var o = S[col][it.i]; if(o) rows.push(toRow(col, o)); }
      });
      var pr = rows.length ? upsertRows(col, rows) : Promise.resolve();
      return pr.then(function(){ items.forEach(function(it){ if(OUT[it.c+':'+it.i] === it) delete OUT[it.c+':'+it.i]; }); persistOut(); });
    });
  }, Promise.resolve()).then(function(){ if(REJ > before){ lastFull = 0; toast('חלק מהשינויים לא אושרו בשרת (אין הרשאה) ובוטלו'); } });
}
function fetchRows(col, since, onlyLive){
  var cols = col === 'clinics' ? 'id,data,deleted,updated_at' : 'id,clinic_id,data,deleted,updated_at';
  var out = [];
  var page = function(from){
    var q = sb.from(col).select(cols);
    if(since) q = q.gte('updated_at', since);
    if(onlyLive) q = q.eq('deleted', false);
    q = q.order('updated_at', { ascending:true }).order('id', { ascending:true }).range(from, from + 999);
    return Promise.resolve(q).then(function(r){ if(r.error) throw r.error; var d = r.data || []; out = out.concat(d); return d.length === 1000 ? page(from + 1000) : out; });
  };

}
function applyRow(col, r){
  var id = r.id, loc = S[col][id], d = r.data || {}, key = col+':'+id, pend = OUT[key];
  if(r.deleted){
    if(!loc) return false;
    if(pend && pend.o === 'put' && (loc.u || 0) > (d.u || 0)) return false;
    delete S[col][id]; return true;
  }
  if(forceIds[key]){ delete forceIds[key]; d.id = id; S[col][id] = d; return true; }
  if(!loc || (d.u || 0) > (loc.u || 0)){ d.id = id; S[col][id] = d; return true; }
  return false;
}
function pullAll(full){
  var since = (!full && CURSOR) ? CURSOR : null;
  var cols = ['clinics','patients','appointments'];
  return Promise.all(cols.map(function(c){ return fetchRows(c, since, !since); })).then(function(res){
    var changed = false, maxTs = CURSOR || '';
    cols.forEach(function(col, i){
      var seen = {};

      if(!since){
        Object.keys(S[col]).forEach(function(id){ if(!seen[id] && !OUT[col+':'+id]){ delete S[col][id]; changed = true; } });
      }
    });
    if(!since) lastFull = Date.now();
    if(maxTs && maxTs !== CURSOR){ CURSOR = maxTs; kvSet('cursor', CURSOR).catch(function(){}); }

    return pullDecls();
  });
}
function pullDecls(){
  return Promise.resolve(sb.from('declarations').select('id,clinic_id,patient_id,payload').eq('consumed', false).limit(50)).then(function(r){
    if(r.error) throw r.error;
    var got = [];
    (r.data || []).forEach(function(x){
      var p = S.patients[x.patient_id]; if(!p || p.clinicId !== x.clinic_id) return;
      var pl = x.payload || {}, n = JSON.parse(JSON.stringify(p));
      n.healthDeclaration = { signed:true, remote:true, date:/^\d{4}-\d{2}-\d{2}$/.test(pl.date) ? pl.date : todayStr(), chronic:String(pl.chronic||'').slice(0,500), meds:String(pl.meds||'').slice(0,500), allergies:String(pl.allergies||'').slice(0,500), signedName:String(pl.signedName||p.name).slice(0,200), signature:okPath(pl.signature) ? pl.signature : '' };
      write('patients', n); got.push(x.id); toast('התקבלה הצהרת בריאות חתומה מ'+p.name);
    });
    if(!got.length) return;
    renderSoft();
    return Promise.resolve(sb.from('declarations').update({ consumed:true }).in('id', got));
  });
}

function doSetup(f){
  var name = f.su_name.value.trim(), phone = f.su_phone.value.trim(), mail = f.su_mail.value.trim(), pw = f.su_pw.value;
  if(!phone && !mail) return showErr('autherr','נדרש טלפון או אימייל.');
  if(phone && normPhone(phone).length<9) return showErr('autherr','מספר הטלפון אינו תקין.');
  if(pw.length<8) return showErr('autherr','הסיסמה צריכה להכיל לפחות 8 תווים.');
  if(pw!==f.su_pw2.value) return showErr('autherr','הסיסמאות אינן זהות.');
  var ae = phone ? pseudoMail(phone) : normMail(mail);
  Promise.resolve(sb.auth.signUp({ email:ae, password:pw })).then(function(r){
    if(r.error) throw r.error;
    if(!r.data.session) throw new Error('יש לכבות את אימות האימייל ב-Supabase (Authentication > Sign In / Providers > Email > Confirm email) ולנסות שוב.');
    return Promise.resolve(sb.rpc('claim_first_admin', { p_name:name, p_phone:phone, p_email:mail, p_auth_email:ae })).then(function(x){
      if(x.error) throw x.error;
      return loadProfile(r.data.user.id).then(function(m){ ME = m; return afterAuth(true); });
    });
  }).catch(function(e){ showErr('autherr','שגיאה: '+errMsg(e)); });
}
function doLogin(f){
  if(Date.now()<lockUntil) return showErr('autherr','יותר מדי ניסיונות. נסה שוב בעוד '+Math.ceil((lockUntil-Date.now())/1000)+' שניות.');
  var idf = f.lg_id.value.trim(), pw = f.lg_pw.value;
  var bad = function(){ fails++; if(fails>=5){ lockUntil = Date.now()+30000; fails = 0; } showErr('autherr','פרטי הכניסה שגויים, או שהחשבון מושבת.'); };
  Promise.resolve(sb.rpc('resolve_login', { idf:idf })).then(function(r){
    if(r.error) throw r.error; if(!r.data){ bad(); return; }
    return Promise.resolve(sb.auth.signInWithPassword({ email:r.data, password:pw })).then(function(a){
      if(a.error){ bad(); return; }
      fails = 0;
      return loadProfile(a.data.user.id).then(function(m){ ME = m; return afterAuth(false); }, function(e){ if(e && e.denied){ sb.auth.signOut(); bad(); } else throw e; });
    });
  }).catch(function(e){ showErr('autherr','שגיאת חיבור: '+errMsg(e)); });
}

function saveProfile(o){
  PROF[o.id] = o;
  return Promise.resolve(sb.from('profiles').update({ name:o.name, phone:o.phone, email:o.email, role:o.role, clinic_ids:o.clinicIds||[], active:o.active!==false }).eq('id', o.id)).then(function(r){ if(r.error) throw r.error; });
}
function saveUserForm(f){
  if(!isAdmin()) return;
  var err = function(m){ showErr('us_err', m); };
  var id = f.dataset.id, old = id ? PROF[id] : null;
  var name = f.us_name.value.trim(), phone = f.us_phone.value.trim(), mail = f.us_mail.value.trim(), pw = f.us_pw.value, role = f.us_role.value;
  var cids = [].slice.call(f.querySelectorAll('input[name=us_cl]:checked')).map(function(i){ return i.value; });
  if(!phone && !mail) return err('נדרש טלפון או אימייל.');
  if(phone && normPhone(phone).length<9) return err('מספר הטלפון אינו תקין.');
  if(!old && !pw) return err('נדרשת סיסמה.');
  if(pw && pw.length<8) return err('הסיסמה צריכה להכיל לפחות 8 תווים.');
  if(role==='manager' && !cids.length) return err('שייך לפחות קליניקה אחת, או הגדר את המשתמש כמנהל מערכת.');
  var clash = userList().filter(function(o){ return o.id!==id && ((phone && o.phone && normPhone(o.phone)===normPhone(phone)) || (mail && o.email && normMail(o.email)===normMail(mail))); })[0];
  if(clash) return err('הטלפון או האימייל כבר משויכים למשתמש אחר: '+clash.name);
  if(old && old.role==='admin' && role!=='admin' && lastAdmin(id)) return err('לא ניתן להסיר את מנהל המערכת האחרון.');
  if(!navigator.onLine) return err('ניהול משתמשים דורש חיבור לאינטרנט.');
  var o = old ? JSON.parse(JSON.stringify(old)) : { createdAt:Date.now(), active:true };
  o.name = name; o.phone = phone; o.email = mail; o.role = role; o.clinicIds = role==='admin' ? [] : cids;
  var finish = function(){ closeModal(); render(); toast('המשתמש נשמר'); };
  var fail = function(e){ err('שגיאה: '+errMsg(e)); };
  if(old){
    saveProfile(o).then(function(){
      if(!pw) return;
      return Promise.resolve(sb.rpc('admin_set_password', { target:id, pw:pw })).then(function(r){ if(r.error) throw r.error; });
    }).then(finish, fail);
    return;
  }
  var ae = phone ? pseudoMail(phone) : normMail(mail);
  var tmp = window.supabase.createClient(CFG.url, CFG.key, { auth:{ persistSession:false, autoRefreshToken:false, detectSessionInUrl:false, storageKey:'cc-tmp' } });
  Promise.resolve(tmp.auth.signUp({ email:ae, password:pw })).then(function(r){
    if(r.error) throw r.error;
    if(!r.data.user || !r.data.session) throw new Error('יש לכבות את אימות האימייל ב-Supabase (Authentication > Sign In / Providers > Email > Confirm email).');
    var row = { id:r.data.user.id, name:name, phone:phone, email:mail, auth_email:ae, role:role, clinic_ids:o.clinicIds, active:true, must_change:true };
    return Promise.resolve(sb.from('profiles').insert(row)).then(function(x){ if(x.error) throw x.error; o.id = row.id; o.authEmail = ae; o.mustChange = true; PROF[o.id] = o; });
  }).then(finish, fail);
}

function submitCfg(f){
  var u = f.cfg_url.value.trim().replace(/\/+$/, ''), k = f.cfg_key.value.trim();
  if(!/^https:\/\/[^\s/]+$/.test(u)) return showErr('cfgerr','כתובת הפרויקט צריכה להיראות כמו https://xxxx.supabase.co');
  showErr('cfgerr','בודק חיבור…');
  rpcFetch(u, k, 'needs_setup', {}).then(function(r){
    if(typeof r !== 'boolean') throw new Error('תגובה לא צפויה מהשרת');
    applyCfg(u, k);
  }).catch(function(e){
    showErr('cfgerr', e && e.status === 404 ? 'השרת נמצא אבל ה-SQL עדיין לא הורץ. העתק אותו והרץ ב-SQL Editor.' : (e && (e.status === 401 || e.status === 403)) ? 'המפתח אינו תקין.' : 'לא ניתן להתחבר: '+errMsg(e));
  });
}

function readImport(input){
  var f = input.files && input.files[0]; input.value = ''; if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    var o; try { o = JSON.parse(String(r.result)); } catch(e){ toast('הקובץ אינו קובץ גיבוי תקין'); return; }
    if(!isObj(o) || !isObj(o.clinics) || !isObj(o.patients) || !isObj(o.appointments)){ toast('הקובץ אינו קובץ גיבוי של CliniCalendar'); return; }
    previewImport(o, o.exportedAt);
  };
  r.onerror = function(){ toast('לא ניתן לקרוא את הקובץ'); };
  r.readAsText(f);
}
function restoreData(o){
  return snapPut('x:'+Date.now(), { clinics:S.clinics, patients:S.patients, appointments:S.appointments }).catch(function(){}).then(function(){
    ['clinics','patients','appointments'].forEach(function(col){
      Object.keys(S[col]).forEach(function(id){ if(!o[col][id]) queue(col, id, 'del', S[col][id]); });
      S[col] = o[col];
      Object.keys(S[col]).forEach(function(id){ S[col][id].id = id; stamp(S[col][id]); queue(col, id); });
    });
    dirty = true; return flushLocal();
  }).then(function(){ snapPrune(); if(saveErr) throw new Error('save failed'); });
}

function makeDeclLink(c, p){
  if(!sb || !navigator.onLine) return Promise.reject(new Error('נדרש חיבור לאינטרנט'));
  var b = new Uint8Array(18); crypto.getRandomValues(b);
  var tok = btoa(String.fromCharCode.apply(null, b)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  return Promise.resolve(sb.from('decl_tokens').insert({ token:tok, clinic_id:c.id, patient_id:p.id, patient_name:p.name, clinic_name:c.name, ctype:isAlt(c)?'alt':'gen', expires_at:new Date(Date.now()+14*864e5).toISOString() })).then(function(r){
    if(r.error) throw r.error;
    return baseUrl()+'#hdc='+enc({ u:CFG.url, k:CFG.key, t:tok });
  });
}

function init(){

    else if(h.indexOf('#hdc=')===0){
      var c = dec(h.slice(5));
      if(c && c.t && /^https:\/\//.test(c.u) && c.k){
        UI.decl = { cloud:true, u:String(c.u), k:String(c.k), t:String(c.t), wait:true };
        rpcFetch(c.u, c.k, 'decl_info', { p_token:c.t }).then(function(r){
          var x = UI.decl; if(!x) return;
          if(!r || !r.pn) x.bad = true; else { x.cn = String(r.cn||''); x.pn = String(r.pn||''); x.alt = r.ct !== 'gen'; }
          x.wait = false; render();
        }).catch(function(){ if(UI.decl){ UI.decl.bad = true; UI.decl.wait = false; render(); } });
      }
    }
    else if(h.indexOf('#hdr=')===0){ var r = dec(h.slice(5)); if(r && r.k==='res') UI.incoming = cleanRes(r); history.replaceState(null, '', location.pathname+location.search); }
    else if(h.indexOf('#cc=')===0){ var j = dec(h.slice(4)); if(j && /^https:\/\//.test(j.u) && j.k) UI.join = { u:String(j.u), k:String(j.k) }; }
  } catch(e){}
  render();
  boot().then(function(){ if(CLOUD && UI.join) showJoin(); }).catch(function(e){ UI.fatal = 'שגיאה בטעינת הנתונים: '+errMsg(e); render(); });
}

var SQL_SETUP = "-- CliniCalendar: סכמת ענן (Supabase). אפשר להריץ שוב בבטחה גם אחרי שדרוג.\ncreate extension if not exists pgcrypto with schema extensions;\n\ncreate table if not exists public.profiles (\n  id uuid primary key references auth.users(id) on delete cascade,\n  name text not null,\n  phone text not null default '',\n  email text not null default '',\n  auth_email text not null,\n  role text not null default 'manager' check (role in ('admin','manager')),\n  clinic_ids text[] not null default '{}',\n  active boolean not null default true,\n  must_change boolean not null default false,\n  created_at timestamptz not null default now()\n);\ncreate table if not exists public.clinics (id text primary key, data jsonb not null default '{}', deleted boolean not null default false, updated_at timestamptz not null default now());\ncreate table if not exists public.patients (id text primary key, clinic_id text not null, data jsonb not null default '{}', deleted boolean not null default false, updated_at timestamptz not null default now());\ncreate table if not exists public.appointments (id text primary key, clinic_id text not null, data jsonb not null default '{}', deleted boolean not null default false, updated_at timestamptz not null default now());\nalter table public.clinics add column if not exists deleted boolean not null default false;\nalter table public.clinics add column if not exists updated_at timestamptz not null default now();\nalter table public.patients add column if not exists deleted boolean not null default false;\nalter table public.patients add column if not exists updated_at timestamptz not null default now();\nalter table public.appointments add column if not exists deleted boolean not null default false;\nalter table public.appointments add column if not exists updated_at timestamptz not null default now();\nalter table public.patients drop constraint if exists patients_clinic_id_fkey;\nalter table public.appointments drop constraint if exists appointments_clinic_id_fkey;\ncreate index if not exists patients_clinic_idx on public.patients(clinic_id);\ncreate index if not exists appointments_clinic_idx on public.appointments(clinic_id);\ncreate index if not exists clinics_upd_idx on public.clinics(updated_at);\ncreate index if not exists patients_upd_idx on public.patients(updated_at);\ncreate index if not exists appointments_upd_idx on public.appointments(updated_at);\n\ncreate table if not exists public.decl_tokens (\n  token text primary key, clinic_id text not null, patient_id text not null,\n  patient_name text not null default '', clinic_name text not null default '', ctype text not null default 'alt',\n  expires_at timestamptz not null, used boolean not null default false, created_at timestamptz not null default now());\ncreate table if not exists public.declarations (\n  id uuid primary key default gen_random_uuid(), clinic_id text not null, patient_id text not null,\n  payload jsonb not null, consumed boolean not null default false, created_at timestamptz not null default now());\n\nalter table public.profiles enable row level security;\nalter table public.clinics enable row level security;\nalter table public.patients enable row level security;\nalter table public.appointments enable row level security;\nalter table public.decl_tokens enable row level security;\nalter table public.declarations enable row level security;\n\ncreate or replace function public.is_admin() returns boolean language sql security definer stable set search_path = public as $$\n  select exists(select 1 from profiles where id = auth.uid() and role = 'admin' and active) $$;\ncreate or replace function public.can_clinic(cid text) returns boolean language sql security definer stable set search_path = public as $$\n  select exists(select 1 from profiles where id = auth.uid() and active and (role = 'admin' or cid = any(clinic_ids))) $$;\n\ncreate or replace function public.touch_updated() returns trigger language plpgsql as $$\nbegin new.updated_at = now(); return new; end $$;\ndrop trigger if exists touch_clinics on public.clinics;\ncreate trigger touch_clinics before insert or update on public.clinics for each row execute function public.touch_updated();\ndrop trigger if exists touch_patients on public.patients;\ncreate trigger touch_patients before insert or update on public.patients for each row execute function public.touch_updated();\ndrop trigger if exists touch_appointments on public.appointments;\ncreate trigger touch_appointments before insert or update on public.appointments for each row execute function public.touch_updated();\n\ndrop policy if exists profiles_select on public.profiles;\ndrop policy if exists profiles_insert on public.profiles;\ndrop policy if exists profiles_update on public.profiles;\ndrop policy if exists profiles_delete on public.profiles;\ncreate policy profiles_select on public.profiles for select using (id = auth.uid() or public.is_admin());\ncreate policy profiles_insert on public.profiles for insert with check (public.is_admin());\ncreate policy profiles_update on public.profiles for update using (public.is_admin()) with check (public.is_admin());\ncreate policy profiles_delete on public.profiles for delete using (public.is_admin());\n\ndrop policy if exists clinics_select on public.clinics;\ndrop policy if exists clinics_insert on public.clinics;\ndrop policy if exists clinics_update on public.clinics;\ndrop policy if exists clinics_delete on public.clinics;\ncreate policy clinics_select on public.clinics for select using (public.can_clinic(id));\ncreate policy clinics_insert on public.clinics for insert with check (public.is_admin());\ncreate policy clinics_update on public.clinics for update using (public.can_clinic(id)) with check (public.can_clinic(id));\ncreate policy clinics_delete on public.clinics for delete using (public.is_admin());\n\ndrop policy if exists patients_all on public.patients;\ndrop policy if exists appointments_all on public.appointments;\ncreate policy patients_all on public.patients for all using (public.can_clinic(clinic_id)) with check (public.can_clinic(clinic_id));\ncreate policy appointments_all on public.appointments for all using (public.can_clinic(clinic_id)) with check (public.can_clinic(clinic_id));\n\ndrop policy if exists decl_tokens_all on public.decl_tokens;\ndrop policy if exists declarations_select on public.declarations;\ndrop policy if exists declarations_update on public.declarations;\ncreate policy decl_tokens_all on public.decl_tokens for all using (public.can_clinic(clinic_id)) with check (public.can_clinic(clinic_id));\ncreate policy declarations_select on public.declarations for select using (public.can_clinic(clinic_id));\ncreate policy declarations_update on public.declarations for update using (public.can_clinic(clinic_id)) with check (public.can_clinic(clinic_id));\n\ncreate or replace function public.norm_phone(p text) returns text language sql immutable as $$\n  select case when d like '972%' then '0' || substr(d, 4) else d end\n  from (select regexp_replace(coalesce(p, ''), '\\D', '', 'g') as d) s $$;\n\ncreate or replace function public.needs_setup() returns boolean language sql security definer stable set search_path = public as $$\n  select not exists(select 1 from profiles) $$;\n\ncreate or replace function public.claim_first_admin(p_name text, p_phone text, p_email text, p_auth_email text) returns void\nlanguage plpgsql security definer set search_path = public as $$\nbegin\n  if auth.uid() is null then raise exception 'not authenticated'; end if;\n  if exists(select 1 from profiles) then raise exception 'already set up'; end if;\n  insert into profiles(id, name, phone, email, auth_email, role)\n  values (auth.uid(), p_name, coalesce(p_phone, ''), coalesce(p_email, ''), p_auth_email, 'admin');\nend $$;\n\ncreate or replace function public.resolve_login(idf text) returns text language sql security definer stable set search_path = public as $$\n  select auth_email from profiles\n  where active and (\n    (position('@' in idf) > 0 and lower(email) = lower(trim(idf)))\n    or (position('@' in idf) = 0 and norm_phone(idf) <> '' and norm_phone(phone) = norm_phone(idf)))\n  limit 1 $$;\n\ncreate or replace function public.admin_set_password(target uuid, pw text) returns void\nlanguage plpgsql security definer set search_path = public, extensions, auth as $$\nbegin\n  if not is_admin() then raise exception 'forbidden'; end if;\n  if length(pw) < 8 then raise exception 'password too short'; end if;\n  update auth.users set encrypted_password = crypt(pw, gen_salt('bf')), updated_at = now() where id = target;\n  update profiles set must_change = (target <> auth.uid()) where id = target;\nend $$;\n\ncreate or replace function public.admin_delete_user(target uuid) returns void\nlanguage plpgsql security definer set search_path = public, auth as $$\nbegin\n  if not is_admin() then raise exception 'forbidden'; end if;\n  if target = auth.uid() then raise exception 'cannot delete yourself'; end if;\n  delete from auth.users where id = target;\nend $$;\n\ncreate or replace function public.clear_must_change() returns void language sql security definer set search_path = public as $$\n  update profiles set must_change = false where id = auth.uid() $$;\n\n-- הצהרת בריאות: המטופל פותח קישור אישי וחד-פעמי ושולח ישירות לשרת, בלי להתחבר\ncreate or replace function public.decl_info(p_token text) returns jsonb language sql security definer stable set search_path = public as $$\n  select jsonb_build_object('cn', clinic_name, 'pn', patient_name, 'ct', ctype)\n  from decl_tokens where token = p_token and not used and expires_at > now() $$;\n\ncreate or replace function public.decl_submit(p_token text, p_payload jsonb) returns boolean\nlanguage plpgsql security definer set search_path = public as $$\ndeclare t decl_tokens; sig text; clean jsonb;\nbegin\n  select * into t from decl_tokens where token = p_token and not used and expires_at > now() for update;\n  if not found then return false; end if;\n  sig := coalesce(p_payload->>'signature', '');\n  if length(sig) > 12000 or sig !~ '^[0-9MLml. ,-]*$' then return false; end if;\n  clean := jsonb_build_object(\n    'chronic', left(coalesce(p_payload->>'chronic', ''), 500),\n    'meds', left(coalesce(p_payload->>'meds', ''), 500),\n    'allergies', left(coalesce(p_payload->>'allergies', ''), 500),\n    'signedName', left(coalesce(p_payload->>'signedName', ''), 200),\n    'signature', sig,\n    'date', to_char(now() at time zone 'Asia/Jerusalem', 'YYYY-MM-DD'));\n  insert into declarations(clinic_id, patient_id, payload) values (t.clinic_id, t.patient_id, clean);\n  update decl_tokens set used = true where token = p_token;\n  return true;\nend $$;\n\nrevoke execute on function public.admin_set_password(uuid, text) from public, anon;\nrevoke execute on function public.admin_delete_user(uuid) from public, anon;\nrevoke execute on function public.claim_first_admin(text, text, text, text) from public, anon;\nrevoke execute on function public.clear_must_change() from public, anon;\ngrant execute on function public.needs_setup() to anon, authenticated;\ngrant execute on function public.resolve_login(text) to anon, authenticated;\ngrant execute on function public.decl_info(text) to anon, authenticated;\ngrant execute on function public.decl_submit(text, jsonb) to anon, authenticated;\n\n-- עדכונים בזמן אמת בין מכשירים\ndo $$\ndeclare t text;\nbegin\n  foreach t in array array['clinics','patients','appointments','declarations'] loop\n    begin\n      execute format('alter publication supabase_realtime add table public.%I', t);\n    exception when others then null;\n    end;\n  end loop;\nend $$;\n";

/* ---------- health declaration (signed by the patient) ---------- */
var enc = function(o){ return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };
var dec = function(s){ s = s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s += '='; return JSON.parse(decodeURIComponent(escape(atob(s)))); };
var baseUrl = function(){ return location.href.split('#')[0]; };
var okPath = function(d){ return typeof d==='string' && d.length<12000 && /^[0-9MLml.,\s-]*$/.test(d); };
var hdStatement = function(alt){ return alt ? 'אני מצהיר/ה שמסרתי את מלוא הפרטים הרפואיים, וידוע לי שטיפול ברפואה סינית ובשיאצו הוא טיפול משלים ואינו מחליף ייעוץ רפואי.' : 'אני מצהיר/ה שמסרתי את מלוא הפרטים הרפואיים הידועים לי, וידוע לי שמסירת מידע חלקי או שגוי עלולה להשפיע על בטיחות הטיפול.'; };
function sigSvg(d, w){
  if(!d || !okPath(d)) return ''; w = w || 150;
  return '<svg viewBox="0 0 300 120" width="'+w+'" height="'+Math.round(w*0.4)+'" style="border:1px solid var(--line);border-radius:8px;background:#fff" role="img" aria-label="חתימה"><path d="'+d+'" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}
function declLink(c, p){ return baseUrl()+'#hd='+enc({ v:1, cid:c.id, cn:c.name, ct:isAlt(c)?'alt':'gen', cw:c.waPhone||c.phone||'', pid:p.id, pn:p.name }); }
var sig = { strokes:[], cur:null, cv:null };
function sigDraw(){
  var cv = sig.cv; if(!cv) return; var g = cv.getContext('2d');
  g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,cv.width,cv.height); g.setTransform(cv.width/300,0,0,cv.height/120,0,0);
  g.strokeStyle = '#111'; g.lineWidth = 2; g.lineCap = 'round'; g.lineJoin = 'round';
  sig.strokes.forEach(function(s){ g.beginPath(); g.moveTo(s[0][0], s[0][1]); if(s.length===1) g.lineTo(s[0][0]+0.1, s[0][1]); s.slice(1).forEach(function(q){ g.lineTo(q[0], q[1]); }); g.stroke(); });
}
function sigInit(){
  var cv = $('#sigpad'); if(!cv) return;
  var r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(r.width*dpr); cv.height = Math.round(r.height*dpr);
  sig.strokes = []; sig.cur = null; sig.cv = cv; sigDraw();
  var pt = function(e){ var b = cv.getBoundingClientRect(); return [Math.round((e.clientX-b.left)*300/b.width), Math.round((e.clientY-b.top)*120/b.height)]; };
  cv.addEventListener('pointerdown', function(e){ e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch(x){} sig.cur = [pt(e)]; sig.strokes.push(sig.cur); sigDraw(); });
  cv.addEventListener('pointermove', function(e){ if(!sig.cur) return; var q = pt(e), l = sig.cur[sig.cur.length-1]; if(Math.abs(q[0]-l[0])+Math.abs(q[1]-l[1])>=2){ sig.cur.push(q); sigDraw(); } });
  var end = function(){ sig.cur = null; };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
}
function sigPath(){
  var pts = sig.strokes.reduce(function(n, s){ return n+s.length; }, 0); if(pts<6) return '';
  var build = function(step){ return sig.strokes.map(function(s){ var a = s.filter(function(q, i){ return i%step===0 || i===s.length-1; }); if(a.length===1) a = [a[0], a[0]]; return 'M'+a[0][0]+' '+a[0][1]+a.slice(1).map(function(q){ return ' L'+q[0]+' '+q[1]; }).join(''); }).join(' '); };
  var d = build(1); if(d.length>9000) d = build(2); return d.length>11000 ? '' : d;
}
function cleanRes(r){
  var s = function(v){ return String(v==null ? '' : v).slice(0,500); };
  return { pid:s(r.pid), pn:s(r.pn), chronic:s(r.chronic), meds:s(r.meds), allergies:s(r.allergies), signedName:s(r.signedName), signature: okPath(r.signature) ? r.signature : '', date: /^\d{4}-\d{2}-\d{2}$/.test(r.date) ? r.date : todayStr() };
}

    + '<dl class="kv"><div><dt>מחלות</dt><dd>'+esc(r.chronic||'אין')+'</dd></div><div><dt>תרופות</dt><dd>'+esc(r.meds||'אין')+'</dd></div><div><dt>רגישויות</dt><dd>'+esc(r.allergies||'אין')+'</dd></div><div><dt>חתימה</dt><dd>'+sigSvg(r.signature)+'</dd></div></dl>'

  if(UI.decl){ closeModal(); app.innerHTML = declPage(UI.decl); sigInit(); return; }
  if(!allLoaded()){
    app.innerHTML = '<div class="center card"><h1>CliniCalendar</h1><p class="muted">'+(UI.slow?'החיבור לשמירה איטי. הנתונים יופיעו ברגע שיגיעו.':'טוען את הנתונים…')+'</p></div>';
    return;
  }
  UI.gate = false;
  if(CLOUD && !ME){
    app.innerHTML = UI.auth==='setup' ? authScreen(true) : UI.auth==='login' ? authScreen(false) : UI.auth==='error' ? authErrCard() : authBusy();

  }

    UI.gate = true;
    var bad = SYNC.state==='err' || SYNC.state==='offline';
    app.innerHTML = '<div class="center card"><h1>CliniCalendar</h1><p class="muted" style="margin-bottom:12px">'+(bad ? 'לא ניתן לטעון את הנתונים מהענן כרגע: '+esc(SYNC.err || 'אין חיבור לאינטרנט')+'.' : 'מסנכרן נתונים…')+'</p>'+(bad ? '<button class="btn primary" data-act="sync-now">ניסיון חוזר</button> <button class="btn" data-act="logout">יציאה</button>' : '')+'</div>';
    return;
  }

  if(!c){ app.innerHTML = isAdmin() ? onboarding() : noAccess(); return; }
  if(UI.incoming){ var inc0 = UI.incoming; UI.incoming = null; setTimeout(function(){ showIncoming(inc0); }, 0); }

  setStatus();

/* dashboard */
function statusPill(s){ return '<span class="pill '+(s==='הושלם'?'good':s==='בוטל'?'bad':'jade')+'">'+esc(s)+'</span>'; }
var DEF_REMIND = 'שלום {שם}, תזכורת לתור שלך ב{יום}, {תאריך}, בשעה {שעה}, בכתובת: {כתובת}. אשמח לראותך.';
var DEF_PAY = 'שלום {שם}, תזכורת להסדרת התשלום עבור {פירוט}. הסכום לתשלום: {סכום}.\nלתשלום ב-Bit או PayBox: {קישור}\nתודה!';
function fillTpl(tpl, v){
  var t = String(tpl);
  if(!v['כתובת']) t = t.replace(/,?\s*[^.,!?\n]*\{כתובת\}/g, '');
  if(!v['קישור']) t = t.replace(/[^.!?\n]*\{קישור\}[^.!?\n]*[.!?]?\s*/g, '');
  return t.replace(/\{([^}]+)\}/g, function(m,k){ return v[k]!=null ? v[k] : m; }).trim();
}
function remindMsg(name, a, c){
  return fillTpl(c.msgRemind || DEF_REMIND, { 'שם':name, 'יום':new Date(a.date+'T12:00:00').toLocaleDateString('he-IL',{weekday:'long'}), 'תאריך':fmtDate(a.date), 'שעה':a.time, 'כתובת':c.address||'' });
}
function payMsg(name, what, amount, dateStr, c){
  return fillTpl(c.msgPay || DEF_PAY, { 'שם':name, 'פירוט':what+(dateStr?' מתאריך '+fmtDate(dateStr):''), 'סכום':money(amount), 'קישור':c.payLink||'' });
}
function apptRow(a, showDate, payMode){

    +'<div class="acts">'+(wa?'<a class="btn link sm" href="'+esc(wa)+'" target="_blank" rel="noopener">'+(payMode?'תזכורת תשלום בוואטסאפ':'תזכורת בוואטסאפ')+'</a>':'')
    +'<button class="btn link sm" data-act="edit-appt" data-id="'+esc(a.id)+'">עריכה</button>'
    +'<button class="btn link danger sm" data-act="del-appt" data-id="'+esc(a.id)+'">מחיקה</button></div></div>';

/* finance */

  var mk = monthKey(new Date());
  var mo = all.filter(function(a){return a.date.slice(0,7)===mk;});
  var paid = mo.filter(function(a){return a.paid;}).reduce(function(s,a){return s+(+a.price||0);},0);
  var unpaid = all.filter(function(a){return !a.paid;}).sort(function(a,b){return byTime(b,a);});
  var unpaidSum = unpaid.reduce(function(s,a){return s+(+a.price||0);},0);

function therOf(c){ return String((c&&c.therapists)||'').split(/[,\n،]/).map(function(x){return x.trim();}).filter(Boolean); }
/* Finds an existing appointment that collides with ap. Same therapist (or unassigned) needs duration + buffer; same patient needs no overlap at all. */
function findConflict(c, ap){
  var buf = +c.bufferTime||0; var s1 = toMin(ap.time), e1 = s1+(+ap.duration||0);
  var list = apptsOf(c.id).filter(function(o){ return o.id!==ap.id && o.date===ap.date && o.status!=='בוטל'; });
  for(var i=0;i<list.length;i++){
    var o=list[i]; var s2=toMin(o.time), e2=s2+(+o.duration||0);
    var sameP = o.patientId && o.patientId===ap.patientId;
    var t1=ap.therapist||'', t2=o.therapist||'';
    var sameT = !t1 || !t2 || t1===t2;
    if(sameT && s1 < e2+buf && s2 < e1+buf) return { appt:o, kind:'ther' };
    if(sameP && s1 < e2 && s2 < e1) return { appt:o, kind:'pat' };
  }
  return null;
}
function nextFree(c, ap){
  var t=toMin(ap.time);
  for(var m=t+5; m<24*60; m+=5){
    var probe=JSON.parse(JSON.stringify(ap)); probe.time=('0'+Math.floor(m/60)).slice(-2)+':'+('0'+(m%60)).slice(-2);
    if(toMin(probe.time)+(+probe.duration||0)>24*60) break;
    if(!findConflict(c, probe)) return probe.time;
  }
  return '';
}
function conflictText(c, ap, hit){
  var o=hit.appt, buf=+c.bufferTime||0; var end=function(x){ var m=toMin(x.time)+(+x.duration||0); return ('0'+Math.floor(m/60)%24).slice(-2)+':'+('0'+(m%60)).slice(-2); };
  var msg = hit.kind==='pat'
    ? 'למטופל/ת הזה כבר יש תור באותו זמן ('+esc(o.time)+'–'+end(o)+').'
    : 'השעה תפוסה'+(o.therapist?' אצל '+esc(o.therapist):'')+': תור של '+esc(o.patientName)+' בין '+esc(o.time)+' ל־'+end(o)+(buf?' (ועוד '+buf+' דק׳ התארגנות)':'')+'.';
  var nf = nextFree(c, ap);
  return msg + (nf ? ' השעה הפנויה הקרובה: <b>'+nf+'</b>.' : '');
}
function apptFromForm(form, c){
  var pid = form.ap_pat ? form.ap_pat.value : '';
  return { id: form.dataset.id||'', patientId: pid, date: form.ap_date.value, time: form.ap_time.value, duration: +form.ap_dur.value||0, therapist: form.ap_ther ? form.ap_ther.value : '' };

function checkConflict(form){
  var c = curClinic(); var box = $('#conflict'); if(!box) return;
  if(!form.ap_date.value||!form.ap_time.value){ box.innerHTML=''; return; }
  var ap = apptFromForm(form, c); var hit = findConflict(c, ap);

function doDelete(kind, id, extra){
  if((kind==='clinic' || kind==='user') && !isAdmin()) return;
  if(kind==='clinic'){
    Object.keys(S.patients).forEach(function(k){ if(S.patients[k].clinicId===id) remove('patients', k); });
    Object.keys(S.appointments).forEach(function(k){ if(S.appointments[k].clinicId===id) remove('appointments', k); });
    remove('clinics', id); UI.clinicId = null; UI.patientId = null;
  } else if(kind==='patient'){
    Object.keys(S.appointments).forEach(function(k){ if(S.appointments[k].patientId===id) remove('appointments', k); });
    remove('patients', id); UI.patientId = null;
  } else if(kind==='treat'){
    var p = S.patients[UI.patientId]; if(p){ var n = JSON.parse(JSON.stringify(p)); n.treatments = n.treatments.filter(function(t){return t.id!==id;}); savePatient(n); }
  } else if(kind==='pkg'){
    var p2 = S.patients[id]; if(p2){ var n2 = JSON.parse(JSON.stringify(p2)); n2.packages = n2.packages.filter(function(k){return k.id!==extra;}); savePatient(n2); }
  } else if(kind==='user'){ if(ME && id!==ME.id) adminDeleteUser(id); } else if(kind==='appt'){ remove('appointments', id); }
  closeModal(); render();
}

document.addEventListener('submit', function(e){
  var f = e.target; var kind = f.dataset && f.dataset.form; if(!kind) return;
  e.preventDefault();
  var c = curClinic();
  if(kind==='decl'){ submitDecl(f); return; }
  if(kind==='cfg'){ submitCfg(f); return; }
  if(kind==='login'){ doLogin(f); return; }
  if(kind==='setup'){ doSetup(f); return; }
  if(kind==='user'){ saveUserForm(f); return; }
  if(kind==='mypw'){ saveMyPw(f); return; }
  if(CLOUD && !ME) return;
  if(kind==='clinic'){
    if(!f.dataset.id && !isAdmin()) return;
    var name = f.cl_name.value.trim(); if(!name) return;
    var ctype = f.cl_type.value;
    var svc = [].slice.call(f.querySelectorAll('#svc_'+ctype+' input[name=cl_svc]:checked')).map(function(i){ return i.value; }).concat(f.cl_svc_other.value.split(',').map(function(x){ return x.trim(); }).filter(Boolean));
    svc = svc.filter(function(x, i){ return svc.indexOf(x)===i; });
    if(!svc.length){ toast('בחר לפחות סוג טיפול אחד'); return; }
    var o = f.dataset.id ? JSON.parse(JSON.stringify(S.clinics[f.dataset.id])) : { id: uid('clinic'), createdAt: Date.now() };
    o.name = name; o.address = f.cl_addr.value.trim(); o.phone = f.cl_phone.value.trim(); o.bufferTime = parseInt(f.cl_buf.value,10)||0; o.payLink = f.cl_pay.value.trim(); o.services = svc; o.type = ctype; o.waPhone = f.cl_wa.value.trim(); o.therapists = therOf({therapists:f.cl_ther.value}).join(', ');
    var mr = f.cl_msg_remind.value.trim(), mp = f.cl_msg_pay.value.trim();
    o.msgRemind = (mr && mr!==DEF_REMIND) ? mr : ''; o.msgPay = (mp && mp!==DEF_PAY) ? mp : '';
    write('clinics', o); UI.clinicId = o.id; closeModal(); render(); toast('הקליניקה נשמרה'); return;
  }
  if(kind==='patient'){
    var p = f.dataset.id ? JSON.parse(JSON.stringify(S.patients[f.dataset.id])) : { id: uid('p'), clinicId: c.id, healthDeclaration:{signed:false}, packages:[], treatments:[], nextSessionNotes:'' };
    p.name = f.pt_name.value.trim(); p.phone = f.pt_phone.value.trim(); p.email = f.pt_email.value.trim();
    p.birthDate = f.pt_birth.value; p.gender = f.pt_gender.value;
    savePatient(p); UI.patientId = p.id; UI.tab = 'patients'; closeModal(); render(); toast('המטופל נשמר'); return;
  }
  if(kind==='treat'){
    var tp = JSON.parse(JSON.stringify(S.patients[UI.patientId])); if(!tp) return;
    var vals = { date: f.tr_date.value, painScore: +f.tr_pain.value, complaint: f.tr_cmp.value.trim(), summary: f.tr_sum.value.trim(), recommendations: f.tr_rec.value.trim() };
    tp.nextSessionNotes = f.tr_next.value.trim();
    tp.treatments = tp.treatments || [];
    if(f.dataset.id){
      tp.treatments = tp.treatments.map(function(t){ return t.id===f.dataset.id ? Object.assign({}, t, vals) : t; });
    } else {
      var num = tp.treatments.reduce(function(m,t){return Math.max(m,t.number||0);},0)+1;
      tp.treatments.push(Object.assign({ id: uid('t'), number: num }, vals));
      var used = false;
      (tp.packages||[]).forEach(function(k){ if(!used && k.used<k.total){ k.used++; used = true; } });
    }
    savePatient(tp); closeModal(); render(); toast('הטיפול נשמר'); return;
  }
  if(kind==='pkg'){
    var pp = JSON.parse(JSON.stringify(S.patients[f.dataset.pid])); pp.packages = pp.packages || [];
    pp.packages.push({ id: uid('pk'), name: f.pk_name.value.trim(), total: Math.max(1, parseInt(f.pk_total.value,10)||1), used: 0, price: parseFloat(f.pk_price.value)||0, paid: f.pk_paid.checked });
    savePatient(pp); closeModal(); render(); toast('החבילה נוספה'); return;
  }
  if(kind==='appt'){
    var pat = S.patients[f.ap_pat.value]; if(!pat) return;
    var ap = f.dataset.id ? JSON.parse(JSON.stringify(S.appointments[f.dataset.id])) : { id: uid('app'), clinicId: c.id };
    ap.patientId = pat.id; ap.patientName = pat.name; ap.phone = pat.phone; ap.service = f.ap_svc.value.trim() || DEFAULT_SERVICE;
    ap.date = f.ap_date.value; ap.time = f.ap_time.value; ap.duration = parseInt(f.ap_dur.value,10)||50; ap.bufferTime = c.bufferTime||0;
    ap.price = parseFloat(f.ap_price.value)||0; ap.status = f.ap_status.value; ap.paid = f.ap_paid.checked;
    ap.therapist = f.ap_ther ? f.ap_ther.value : '';
    if(ap.status!=='בוטל'){ var hit = findConflict(c, ap); if(hit){ checkConflict(f); toast('לא ניתן לשמור: התור מתנגש עם תור אחר'); return; } }
    write('appointments', ap); UI.day = ap.date; var dd = new Date(ap.date+'T12:00:00'); UI.cal = {y:dd.getFullYear(), m:dd.getMonth()};
    closeModal(); render(); toast('התור נשמר'); return;
  }
});

document.addEventListener('input', function(e){
  var t = e.target;
  if(t.id==='psearch'){ UI.search = t.value; var c = curClinic(); var l = $('#plist'); if(l && c) l.innerHTML = plistHtml(c); return; }
  if(t.id==='tr_pain'){ var o = $('#tr_pain_o'); if(o) o.textContent = t.value; return; }
  var f = t.form; if(f && f.dataset.form==='appt' && /^ap_(date|time|dur|ther|pat|status)$/.test(t.id)) checkConflict(f);
});
document.addEventListener('change', function(e){
  var t = e.target;
  if(t.id==='importFile'){ readImport(t); return; }
  if(t.id==='us_role'){ var bx = $('#us_cl_box'); if(bx) bx.style.display = t.value==='admin' ? 'none' : 'block'; return; }
  if(t.id==='cl_type'){ var ga = $('#svc_alt'), gg = $('#svc_general'); if(ga) ga.style.display = t.value==='alt' ? '' : 'none'; if(gg) gg.style.display = t.value==='general' ? '' : 'none'; return; }
  if(t.id==='clinicSel'){ UI.clinicId = t.value; UI.patientId = null; render(); return; }
  if(t.dataset && t.dataset.notes){
    var p = S.patients[t.dataset.notes]; if(!p) return;
    var v = t.value.trim(); if(v===(p.nextSessionNotes||'')) return;
    var n = JSON.parse(JSON.stringify(p)); n.nextSessionNotes = v; savePatient(n); toast('הדגשים נשמרו');
  }
});
document.addEventListener('keydown', function(e){ if(e.key==='Escape' && $('#modal').innerHTML) closeModal(); });

/* ---------- backup & restore ---------- */
var isObj = function(x){ return !!x && typeof x==='object' && !Array.isArray(x); };
function snapshot(){ return { app:'CliniCalendar', version:2, exportedAt:new Date().toISOString(), clinics:S.clinics, patients:S.patients, appointments:S.appointments }; }
function stats(o){
  var pk=0, tr=0, hd=0;
  Object.keys(o.patients).forEach(function(k){ var p=o.patients[k]||{}; pk+=(p.packages||[]).length; tr+=(p.treatments||[]).length; if(p.healthDeclaration && p.healthDeclaration.signed) hd++; });
  return { clinics:Object.keys(o.clinics).length, patients:Object.keys(o.patients).length, treatments:tr, packages:pk, declarations:hd, appointments:Object.keys(o.appointments).length };
}
function statsHtml(st){
  var rows = [['קליניקות',st.clinics],['מטופלים',st.patients],['תיעוד טיפולים',st.treatments],['חבילות וכרטיסיות',st.packages],['הצהרות בריאות חתומות',st.declarations],['תורים',st.appointments]];
  return '<dl class="kv">'+rows.map(function(r){ return '<div><dt>'+r[0]+'</dt><dd class="strong">'+r[1]+'</dd></div>'; }).join('')+'</dl>';
}
function lastBackup(){ try { return localStorage.getItem(BKEY) || ''; } catch(e){ return ''; } }
function fmtStamp(iso){ var d = new Date(iso); return isNaN(d.getTime()) ? '' : fmtDate(ymd(d))+' בשעה '+pad(d.getHours())+':'+pad(d.getMinutes()); }
function stampText(){ var lb = lastBackup(); var t = lb ? fmtStamp(lb) : ''; return t ? 'גיבוי אחרון מהמכשיר הזה: '+t : 'טרם נוצר גיבוי מהמכשיר הזה.'; }
function backup(){
  var data = JSON.stringify(snapshot(), null, 2);
  return saveFile('clinicalendar-backup-'+todayStr()+'.json', data).then(function(ok){
    if(!ok) return;
    try { localStorage.setItem(BKEY, new Date().toISOString()); } catch(e){}
    toast('קובץ הגיבוי נשמר'); render();
    var el = $('#bkstamp'); if(el) el.textContent = stampText();
  });
}
function doImport(){
  if(!pendingImport) return; var o = pendingImport; pendingImport = null;
  openModal('משחזר נתונים', '<p id="rprog" class="muted">מתחיל…</p>');
  var finish = function(ok){ UI.clinicId = null; UI.patientId = null; closeModal(); render(); toast(ok ? 'הנתונים שוחזרו בהצלחה' : 'השחזור לא הושלם. בדוק את החיבור ונסה שוב'); };
  restoreData(o, function(i,n){ var e = $('#rprog'); if(e) e.textContent = 'משחזר… '+i+' מתוך '+n; }).then(function(){ finish(true); }, function(){ finish(false); });
}
function saveFile(name, data){
  try {
    var blob = new Blob([data], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    return Promise.resolve(true);
  } catch(e){ toast('לא ניתן ליצור קובץ גיבוי'); return Promise.resolve(false); }
}

init();
})();
</script>
